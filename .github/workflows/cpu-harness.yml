name: CPU harness (no game files)
on:
  push:
    branches: [mac-port, 'codex/mac-port-*']
  pull_request:
    branches: [mac-port]
permissions:
  contents: read
jobs:
  posix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Apple Silicon runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = arm64
      - name: Configure CPU targets
        run: cmake -S . -B out/cpu -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build out/cpu --parallel 2
      - name: Test
        run: ctest --test-dir out/cpu --output-on-failure
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-winpthreads
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
      - name: Configure CPU targets
        run: cmake -S . -B out/cpu -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=clang
      - name: Build
        run: cmake --build out/cpu --parallel 2
      - name: Test
        run: ctest --test-dir out/cpu --output-on-failure
